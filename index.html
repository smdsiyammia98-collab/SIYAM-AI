
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIYAM AI - Personal Assistant</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#061a3a,#0878d9);
  color:#17345c
}
.app{
  width:100%;max-width:430px;background:white;
  padding:20px;border-radius:24px;
  box-shadow:0 15px 45px #00152d66
}
.logo{
  width:75px;height:75px;border-radius:50%;
  margin:auto;display:grid;place-items:center;
  background:linear-gradient(135deg,#168cff,#063c91);
  color:white;font-size:28px;font-weight:bold
}
h1{text-align:center;margin-bottom:5px}
.sub{text-align:center;color:#71839b}
input,textarea{
  width:100%;padding:13px;margin:7px 0;
  border:1px solid #c8d9ee;border-radius:12px;
  font-size:16px
}
textarea{height:75px;resize:vertical}
button{
  width:100%;border:0;border-radius:12px;
  padding:13px;margin-top:9px;
  font-size:15px;font-weight:bold;color:white;
  background:#0877df;cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
.google{background:#34445c}
.secondary{background:#0b9b79}
.stop{background:#64748b}
#chat{
  height:300px;overflow-y:auto;
  background:#f0f6ff;padding:12px;
  border-radius:15px;margin:18px 0
}
.message{
  padding:11px 13px;border-radius:13px;
  margin:9px 0;line-height:1.5;
  overflow-wrap:anywhere;white-space:pre-wrap
}
.user{background:#d5eaff;margin-left:25px}
.ai{background:white;margin-right:25px}
.controls{
  display:grid;grid-template-columns:1fr 1fr;
  gap:9px;margin-top:10px
}
.controls button{margin:0}
#status{text-align:center;color:#71839b;font-size:13px}
#chatArea{display:none}
#authArea{display:block}
.small{text-align:center;font-size:13px;color:#71839b}
</style>
</head>

<body>
<main class="app">
  <div class="logo">AI</div>
  <h1>SIYAM AI</h1>
  <p class="sub">Your Personal Assistant</p>

  <section id="authArea">
    <h3>Login / Create Account</h3>

    <input id="email" type="email"
      placeholder="তোমার Email লিখো"
      autocomplete="email">

    <input id="password" type="password"
      placeholder="Password লিখো"
      autocomplete="current-password">

    <button onclick="registerUser()">Create Account</button>
    <button onclick="loginUser()">Login</button>

    <button class="google" onclick="googleLogin()">
      Continue with Google
    </button>

    <p class="small" id="authStatus">
      Firebase Authentication
    </p>
  </section>

  <section id="chatArea">
    <p class="small" id="userInfo"></p>
    <button class="stop" onclick="logoutUser()">Logout</button>

    <div id="chat" aria-live="polite">
      <div class="message ai">
        হ্যালো! আমি SIYAM AI।
        বাংলা অথবা ইংরেজিতে আমাকে প্রশ্ন করতে পারো।
      </div>
    </div>

    <textarea id="message"
      maxlength="4000"
      placeholder="এখানে লিখো..."></textarea>

    <button id="sendBtn" onclick="sendMessage()">
      Send Message
    </button>

    <div class="controls">
      <button class="secondary" onclick="startListening()">
        🎤 Speak
      </button>
      <button class="stop" onclick="stopSpeaking()">
        🔇 Stop Voice
      </button>
    </div>
  </section>

  <p id="status">Ready</p>
</main>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
  getAI,
  getGenerativeModel,
  GoogleAIBackend
}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-ai.js";

// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyDfQiByWeYH8nGoFdVIkpeaOD3DMYKE6SY",
  authDomain: "siyam-ai-dfa17.firebaseapp.com",
  projectId: "siyam-ai-dfa17",
  storageBucket: "siyam-ai-dfa17.firebasestorage.app",
  messagingSenderId: "860604202308",
  appId: "1:860604202308:web:317e6e73257b9933806b11",
  measurementId: "G-DL0RMGY75Y"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const authArea = document.getElementById("authArea");
const chatArea = document.getElementById("chatArea");
const authStatus = document.getElementById("authStatus");
const statusText = document.getElementById("status");
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");

// Firebase AI Logic
let aiModel = null;

try {
  const ai = getAI(app, {
    backend: new GoogleAIBackend()
  });

  aiModel = getGenerativeModel(ai, {
    model: "gemini-4-hydrogen"
  });
} catch (error) {
  console.error("AI initialization error:", error);
}

// Account creation
window.registerUser = async function() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    authStatus.textContent = "Email এবং Password লিখো।";
    return;
  }

  try {
    await createUserWithEmailAndPassword(auth, email, password);
    authStatus.textContent = "Account তৈরি হয়েছে!";
  } catch (error) {
    authStatus.textContent = error.message;
  }
};

// Login
window.loginUser = async function() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    authStatus.textContent = "Email এবং Password লিখো।";
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
    authStatus.textContent = "Login সফল!";
  } catch (error) {
    authStatus.textContent = error.message;
  }
};

// Google Login
window.googleLogin = async function() {
  try {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
  } catch (error) {
    authStatus.textContent = error.message;
  }
};

// Logout
window.logoutUser = async function() {
  try {
    stopSpeaking();
    await signOut(auth);
  } catch (error) {
    statusText.textContent = error.message;
  }
};

// Authentication state
onAuthStateChanged(auth, user => {
  if (user) {
    authArea.style.display = "none";
    chatArea.style.display = "block";
    document.getElementById("userInfo").textContent =
      "Logged in: " + (user.email || "Google User");
  } else {
    authArea.style.display = "block";
    chatArea.style.display = "none";
  }
});

// Chat history for the current page session
const conversationHistory = [];

function addMessage(text, who) {
  const item = document.createElement("div");
  item.className = "message " + who;
  item.textContent = text;
  chat.appendChild(item);
  chat.scrollTop = chat.scrollHeight;
}

// Real AI response
async function getAIReply(userText) {
  if (!aiModel) {
    throw new Error(
      "AI চালু হয়নি। Firebase AI Logic সেটআপ পরীক্ষা করো।"
    );
  }

  const recentHistory = conversationHistory
    .slice(-10)
    .map(item =>
      (item.role === "user" ? "User: " : "SIYAM AI: ") + item.text
    )
    .join("\n");

  const prompt = `
তোমার নাম SIYAM AI।
তুমি একজন সহায়ক Personal Assistant।
বাংলা ও ইংরেজি দুই ভাষায় উত্তর দেবে।
ব্যবহারকারী যে ভাষায় প্রশ্ন করবে, সেই ভাষায় উত্তর দেবে।
সহজ, পরিষ্কার ও ভদ্রভাবে উত্তর দেবে।
তুমি ফোনে কোনো কাজ নিজে করতে পারো না, তাই এমন দাবি করবে না।
নিরাপত্তা ও গোপনীয়তা বজায় রাখবে।

আগের কথোপকথন:
${recentHistory}

ব্যবহারকারীর নতুন প্রশ্ন:
${userText}
`;

  const result = await aiModel.generateContent(prompt);
  const responseText = result.response.text();

  if (!responseText) {
    throw new Error("AI থেকে কোনো উত্তর পাওয়া যায়নি।");
  }

  return responseText;
}

// Send message
window.sendMessage = async function() {
  const text = input.value.trim();

  if (!text || sendBtn.disabled) return;

  if (!auth.currentUser) {
    statusText.textContent = "আগে Login করো।";
    return;
  }

  if (text.length > 4000) {
    statusText.textContent = "মেসেজটি অনেক বড়।";
    return;
  }

  addMessage(text, "user");
  conversationHistory.push({ role: "user", text });

  input.value = "";
  sendBtn.disabled = true;
  sendBtn.textContent = "AI উত্তর দিচ্ছে...";
  statusText.textContent = "SIYAM AI ভাবছে...";

  try {
    const reply = await getAIReply(text);

    addMessage(reply, "ai");
    conversationHistory.push({ role: "ai", text: reply });

    speak(reply);
    statusText.textContent = "AI response received";
  } catch (error) {
    console.error(error);

    const message =
      "দুঃখিত, AI সংযোগে সমস্যা হয়েছে। Firebase AI Logic চালু আছে কি না এবং ইন্টারনেট সংযোগ পরীক্ষা করো।";

    addMessage(message, "ai");
    statusText.textContent = error.message || "AI connection error";
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = "Send Message";
  }
};

// Voice output
function speak(text) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = /[\u0980-\u09FF]/.test(text)
    ? "bn-BD"
    : "en-US";

  utterance.rate = 0.95;
  speechSynthesis.speak(utterance);
}

// Voice input
const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

window.startListening = function() {
  if (!SpeechRecognition) {
    statusText.textContent =
      "এই Browser-এ Voice input supported নয়।";
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "bn-BD";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = () => {
    statusText.textContent = "শুনছি... এখন কথা বলো।";
  };

  recognition.onresult = event => {
    input.value = event.results[0][0].transcript;
    statusText.textContent =
      "কথা লেখা হয়েছে। Send চাপো।";
  };

  recognition.onerror = event => {
    statusText.textContent =
      "Voice error: " + event.error;
  };

  recognition.onend = () => {
    if (statusText.textContent.includes("শুনছি")) {
      statusText.textContent = "Voice input বন্ধ হয়েছে।";
    }
  };

  recognition.start();
};

// Stop voice
window.stopSpeaking = function() {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  if (recognition) {
    recognition.stop();
  }

  statusText.textContent = "Voice stopped";
};

// Ctrl + Enter to send
input.addEventListener("keydown", event => {
  if (event.key === "Enter" && event.ctrlKey) {
    event.preventDefault();
    window.sendMessage();
  }
});
</script>
</body>
</html>
